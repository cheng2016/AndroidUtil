name: Bug report
description: Report a reproducible AndroidUtil problem
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, tokens, and personal data from logs.
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [core, network, permissions, sample, build or documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AndroidUtil version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code, expected behavior, actual behavior, Android API level, and device/emulator.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or stack trace
